<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apply for early access | Heura Studio</title>
<meta name="description" content="Apply for early access to Heura Studio, the no-code way to build your company's own AI.">
<meta name="theme-color" content="#f5f5f7" data-light="#f5f5f7" data-dark="#0d0d0e">
<!-- The theme: the choice saved by the switch in the header, else the system's. Set before anything paints. -->
<script>(function(d){var t,m;try{t=localStorage.getItem('ov-theme')}catch(e){}if(t!=='light'&&t!=='dark')t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';d.setAttribute('data-theme',t);d.classList.add('ov-js');m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',m.getAttribute('data-'+t))})(document.documentElement)</script>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/icon-512.png" type="image/png" sizes="512x512">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<link rel="stylesheet" href="/site.css">
<link rel="stylesheet" href="/early-access/apply.css">
<!-- signup.js turns the form into two steps. Without it (no JavaScript, or the file fails to load) the form
     stays a plain one that posts name, email and company. -->
<script>if (window.fetch && window.URLSearchParams && window.FormData) document.documentElement.classList.add('js');</script>
<script src="/early-access/signup.js" defer onerror="document.documentElement.classList.remove('js')"></script>
<script src="/theme.js" defer></script>
</head>
<body>
<div id="ov-home" class="ap">
  <header class="ap-top">
    <a class="ov-logo" href="/"><span class="ov-mark" aria-hidden="true"></span><span class="ap-wordmark">Heura Studio</span></a>
    <nav class="ap-nav" aria-label="Main">
      <a class="ap-link" href="mailto:ryantian@ostravanne.com,leoli@ostravanne.com?subject=Heura%20Studio%20demo">Book a demo</a>
      <button class="ov-theme" type="button" aria-label="Switch to dark mode">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <mask id="ov-moon-bite"><rect width="24" height="24" fill="#fff"/><circle class="ov-bite" cx="18" cy="6.5" r="6.5" fill="#000"/></mask>
          <circle class="ov-orb" cx="12" cy="12" r="8" fill="currentColor" mask="url(#ov-moon-bite)"/>
          <path class="ov-rays" d="M12 1.75v2.1M12 20.15v2.1M1.75 12h2.1M20.15 12h2.1M4.75 4.75l1.5 1.5M17.75 17.75l1.5 1.5M4.75 19.25l1.5-1.5M17.75 6.25l1.5-1.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
        </svg>
      </button>
      <a class="ap-pill" href="https://heurastudios.com/login">Log in</a>
    </nav>
  </header>

  <!-- The drawing, drawn once per theme by _tools/draw-early-access.js; the one for the current theme shows. -->
  <div class="ap-art">
    <img class="ap-plate is-light" src="/early-access/drawing.svg" alt="" width="1000" height="1100">
    <img class="ap-plate is-dark" src="/early-access/drawing-dark.svg" alt="" width="1000" height="1100">
  </div>

  <main class="ap-main">
    <div class="ap-panel">
      <h1 id="ea-title">Apply for<br> early access</h1>
      <p class="ap-lead">Heura Studio is opening to a few companies at a time. Apply with your work email and we'll write to you when you're in.</p>

      <!-- data-google-client-id: the OAuth client ID for "Continue with Google", the same one as
           GOOGLE_CLIENT_ID in _backend/Code.gs. While it's empty the Google option stays hidden. -->
      <form id="ea-form" class="ap-form" method="post" action="https://script.google.com/macros/s/AKfycbxeGXRIPZbw9SmmELM12JjJCPv7J-dosWmukFCh4RN90vVQsfV1jGKtJcDdEren_k8BEQ/exec" data-google-client-id="" aria-labelledby="ea-title">
        <div class="ap-field">
          <div class="ap-label-row">
            <label for="ea-email">Work email</label>
            <button class="ap-back" type="button" hidden>Use a different email</button>
          </div>
          <div class="ap-input">
            <svg class="ap-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><rect x="1.75" y="3.25" width="12.5" height="9.5" rx="1.5"/><path d="m2.5 4.5 5.5 4.25 5.5-4.25"/></svg>
            <input id="ea-email" name="email" type="email" autocomplete="email" maxlength="254" placeholder="you@company.com" required>
          </div>
        </div>

        <div class="ap-step1">
          <button class="ap-continue" type="button">Continue with email</button>
          <p class="ap-or" hidden>or</p>
          <div class="ap-google" hidden></div>
        </div>

        <div class="ap-step2">
          <div class="ap-field">
            <label for="ea-name">Name</label>
            <input id="ea-name" name="name" type="text" autocomplete="name" maxlength="100" required>
          </div>
          <div class="ap-field">
            <label for="ea-company">Company</label>
            <input id="ea-company" name="company" type="text" autocomplete="organization" maxlength="100" required>
          </div>
          <div class="ea-trap" aria-hidden="true">
            <label for="ea-website">Leave this empty</label>
            <input id="ea-website" name="website" type="text" tabindex="-1" autocomplete="off">
          </div>
          <button class="ap-submit ea-submit" type="submit">Request early access</button>
        </div>
      </form>
      <p id="ea-status" class="ap-status" role="status"></p>

      <p class="ap-note">We read every application ourselves. Questions before you apply? <a href="mailto:ryantian@ostravanne.com,leoli@ostravanne.com">Email the founders</a>.</p>
    </div>
  </main>
</div>
</body>
</html>
