<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request early access | Heura Studio</title>
<meta name="description" content="Ask for early access to Heura Studio, the no-code way to build your company's own AI.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/icon-512.png" type="image/png" sizes="512x512">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<link rel="stylesheet" href="/site.css">
<script src="/early-access/signup.js" defer></script>
</head>
<body>
<div id="ov-home">
  <header class="ov-wrap ov-top">
    <a class="ov-logo" href="/"><span class="ov-mark" aria-hidden="true"></span>Heura Studio</a>
  </header>

  <main class="ov-wrap">
    <section class="ea" aria-labelledby="ea-title">
      <h1 id="ea-title">Request early access</h1>
      <p class="ea-lead">Tell us who you are. We'll email you when you're in.</p>
      <form id="ea-form" class="ea-form" method="post" action="https://script.google.com/macros/s/AKfycbxeGXRIPZbw9SmmELM12JjJCPv7J-dosWmukFCh4RN90vVQsfV1jGKtJcDdEren_k8BEQ/exec">
        <div class="ea-field">
          <label for="ea-name">Name</label>
          <input id="ea-name" name="name" type="text" autocomplete="name" maxlength="100" required>
        </div>
        <div class="ea-field">
          <label for="ea-email">Work email</label>
          <input id="ea-email" name="email" type="email" autocomplete="email" maxlength="254" required>
        </div>
        <div class="ea-field">
          <label for="ea-company">Company</label>
          <input id="ea-company" name="company" type="text" autocomplete="organization" maxlength="100" required>
        </div>
        <div class="ea-trap" aria-hidden="true">
          <label for="ea-website">Leave this empty</label>
          <input id="ea-website" name="website" type="text" tabindex="-1" autocomplete="off">
        </div>
        <button class="ov-btn ov-btn-primary ea-submit" type="submit">Request early access</button>
      </form>
      <p id="ea-status" class="ea-status" role="status"></p>
    </section>
  </main>

  <footer class="ov-wrap">
    <div class="ov-foot">
      <span>Heura Studio by Ostravanne</span>
      <a href="mailto:hello@ostravanne.com">hello@ostravanne.com</a>
    </div>
  </footer>
</div>
</body>
</html>
